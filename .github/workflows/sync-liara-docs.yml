name: Sync Liara docs and deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if the documentation has not changed
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - "app/**"
      # ingest/ اینجا نبود، پس تغییر خط لوله‌ی ساخت ایندکس دیپلوی را
      # تریگر نمی‌کرد — در حالی که خروجی‌اش مستقیماً در ایمیج می‌رود.
      - "ingest/**"
      - "static/**"
      - "Dockerfile"
      - "requirements.txt"
      - "liara.json"
      - ".github/workflows/sync-liara-docs.yml"
  schedule:
    # Twice an hour, away from the busy start-of-hour window.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: liara-docs-production
  cancel-in-progress: false

env:
  # تنها منبع حقیقت برای مدل امبدینگ در CI. باید با MODEL_EMBEDDING روی
  # پنل لیارا یکی باشد، وگرنه سرویس با ایندکس ناهماهنگ بالا می‌آید و
  # app/retrieval.py عمداً بالا نمی‌آورَدش.
  MODEL_EMBEDDING: ${{ vars.MODEL_EMBEDDING || 'google/gemini-embedding-001' }}

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Fetch latest Liara documentation
        run: >-
          git clone --depth 1 --branch master --single-branch
          https://github.com/liara-cloud/docs.git docs

      - name: Read documentation revision
        id: docs
        shell: bash
        run: echo "sha=$(git -C docs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A release is identified by both sides of the deployment: the current
      # application commit and the documentation snapshot. Previously this key
      # only included the docs, so application-only fixes were silently skipped.
      - name: Check whether this release was deployed
        id: deployed
        uses: actions/cache@v6
        with:
          path: .sync-state
          key: deployed-release-${{ github.sha }}-${{ hashFiles('docs/src/pages/**/*.mdx') }}

      - name: Set up Python
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore embedding cache
        id: embedding-cache
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/cache/restore@v6
        with:
          path: .cache
          # مدل در کلید هست: بدون آن، عوض کردن مدل امبدینگ کش قبلی را
          # restore می‌کرد، همه‌ی تکه‌ها hit می‌شدند، هیچ تماسی با API
          # نمی‌رفت و ایندکسِ مدلِ قبلی با برچسب مدلِ جدید build می‌شد.
          key: embeddings-v2-${{ env.MODEL_EMBEDDING }}-${{ hashFiles('docs/src/pages/**/*.mdx') }}
          restore-keys: |
            embeddings-v2-${{ env.MODEL_EMBEDDING }}-

      - name: Install Python dependencies
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        run: pip install -r requirements.txt

      - name: Build document indexes
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        run: python -m ingest.run_all
        env:
          USE_MOCK: "false"
          LIARA_AI_BASE_URL: ${{ secrets.LIARA_AI_BASE_URL }}
          LIARA_AI_API_KEY: ${{ secrets.LIARA_AI_API_KEY }}

      - name: Validate generated indexes
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pickle
          from pathlib import Path

          import numpy as np

          data = Path("data")
          chunks = json.loads((data / "chunks.json").read_text(encoding="utf-8"))
          vectors = np.load(data / "vectors.npy", mmap_mode="r")
          with (data / "bm25.pkl").open("rb") as file:
              bm25 = pickle.load(file)

          if not chunks:
              raise SystemExit("No documentation chunks were generated")
          if vectors.ndim != 2 or vectors.shape[0] != len(chunks):
              raise SystemExit("chunks.json and vectors.npy are inconsistent")
          if len(bm25.doc_freqs) != len(chunks):
              raise SystemExit("chunks.json and bm25.pkl are inconsistent")

          # این چک بود که نبودنش باعث شد ایندکسِ مدلِ قبلی از کش بیرون
          # بیاید و بی‌سروصدا deploy شود.
          expected = os.environ["MODEL_EMBEDDING"]
          meta = json.loads((data / "index_meta.json").read_text(encoding="utf-8"))
          if meta.get("model") != expected:
              raise SystemExit(
                  f"index built with {meta.get('model')} but MODEL_EMBEDDING is {expected}"
              )

          print(f"Validated {len(chunks)} chunks, dim={vectors.shape[1]}, model={expected}")
          PY

      # Persist embeddings before deployment so a deployment failure does not
      # cause the paid embedding work to be repeated on the next run.
      - name: Save embedding cache
        if: >-
          (steps.deployed.outputs.cache-hit != 'true' || inputs.force == true) &&
          steps.embedding-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: embeddings-v1-${{ hashFiles('docs/src/pages/**/*.mdx') }}

      - name: Set up Node.js
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Liara CLI
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        run: npm install --global @liara/cli@9

      - name: Deploy to Liara
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME || 'liara-docs-assistant' }}
          LIARA_TEAM_ID: "6a868936fbcb9407788ee7a7"
        shell: bash
        run: |
          liara deploy \
            --api-token "$LIARA_API_TOKEN" \
            --app "$LIARA_APP_NAME" \
            --team-id "$LIARA_TEAM_ID" \
            --platform docker \
            --port 8000 \
            --no-app-logs \
            --message "app ${{ github.sha }} / docs ${{ steps.docs.outputs.sha }}"

      # actions/cache saves this marker only after every previous step succeeds.
      - name: Mark release as deployed
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force == true
        shell: bash
        run: |
          mkdir -p .sync-state
          echo "${{ steps.docs.outputs.sha }}" > .sync-state/docs-sha
          echo "${{ github.sha }}" > .sync-state/app-sha
