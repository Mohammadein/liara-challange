<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار مستندات لیارا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232196f3'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'>ل</text></svg>">
<!--
  اسکلت فاز ۰ — عمداً بدون هیچ CDN نوشته شده.
  دلیل: وابستگی به CDN یعنی ریسک روی زیرساخت لیارا و مرورگر داور.
  هر کتابخانه‌ای لازم شد، باید داخل static/ کپی (vendor) شود، نه لینک به CDN.

  ابوالفضل: این فقط داربست است تا قرارداد SSE قابل دیدن باشد.
  آزادی کامل داری بازنویسی‌اش کنی — فقط شکل رویدادها در app/contracts.py ثابت بماند.
-->
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #98a0ae;
    --accent: #2196f3;
    --user: #23304a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    line-height: 1.85; height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 20px 16px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { margin-bottom: 22px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: var(--radius); white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user); }
  .tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .tool {
    font-size: 12px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; display: inline-flex; align-items: center; gap: 8px;
    width: fit-content;
  }
  .tool.running::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1s infinite;
  }
  .tool.done::before { content: "✓"; color: #3ddc84; font-size: 11px; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  pre {
    direction: ltr; text-align: left; background: #0b0d11;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 12px 0;
  }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  :not(pre) > code {
    direction: ltr; display: inline-block; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 6px; font-size: 12.5px;
  }
  .sources { margin-top: 14px; }
  .sources .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .src {
    display: block; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; margin-bottom: 6px;
    text-decoration: none; color: var(--text); font-size: 13px;
  }
  .src:hover { border-color: var(--accent); }
  .src .sec { color: var(--muted); font-size: 12px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .err {
    border-color: #7f2b2b; background: #2a1414; color: #ffb4b4;
  }
  footer {
    border-top: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  form { display: flex; gap: 8px; max-width: 820px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font: inherit; font-size: 14px; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 20px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .hint {
    font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 13px; cursor: pointer; color: var(--muted);
  }
  .hint:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 600px) {
    #log { padding: 14px 12px; }
    header h1 { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>دستیار مستندات لیارا</h1>
  <span class="badge" id="mode">…</span>
</header>

<div id="log">
  <div class="hints">
    <span class="hint">نسخه پایتون رو کجا تعیین کنم؟</span>
    <span class="hint">می‌خوام جنگو دیپلوی کنم</span>
    <span class="hint">خطا: could not install packages</span>
  </div>
</div>

<footer>
  <form id="f">
    <textarea id="q" rows="1" placeholder="سؤالت درباره مستندات لیارا رو بپرس…" autocomplete="off"></textarea>
    <button type="submit" id="send">ارسال</button>
  </form>
</footer>

<script src="/app.js"></script>
</body>
</html>
