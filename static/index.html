<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار مستندات لیارا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232196f3'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white'>ل</text></svg>">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b;
    --border: #2a2f3a; --text: #e6e8ec; --muted: #98a0ae;
    --accent: #2196f3; --user: #23304a; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    line-height: 1.85; height: 100dvh; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  .app { height: 100%; display: flex; }
  .sidebar {
    width: 290px; flex: 0 0 290px; background: #12151b;
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    padding: 14px; z-index: 20;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand strong { font-size: 14px; }
  .new-chat {
    width: 100%; border: 1px solid #3b77a8; border-radius: 10px;
    background: #18334a; color: #d9efff; padding: 9px 12px; margin-bottom: 14px;
  }
  .new-chat:hover { background: #20445f; }
  .history-label { color: var(--muted); font-size: 11px; padding: 0 5px 6px; }
  #sessions { overflow-y: auto; flex: 1; }
  .session {
    position: relative; display: flex; align-items: center; gap: 4px;
    border-radius: 9px; margin-bottom: 3px; border: 1px solid transparent;
  }
  .session.active { background: var(--panel-2); border-color: var(--border); }
  .session-main {
    min-width: 0; flex: 1; padding: 9px 8px; color: var(--text);
    background: transparent; border: 0; text-align: right;
  }
  .session-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .session-time { display: block; color: var(--muted); font-size: 10px; margin-top: 1px; }
  .session-actions { display: flex; padding-left: 5px; opacity: 0; transition: opacity .15s; }
  .session:hover .session-actions, .session.active .session-actions { opacity: 1; }
  .icon-btn {
    width: 29px; height: 29px; padding: 0; color: var(--muted);
    border: 0; background: transparent; border-radius: 7px;
  }
  .icon-btn:hover { background: #29303b; color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }
  .sidebar-foot { color: var(--muted); font-size: 10px; border-top: 1px solid var(--border); padding: 10px 5px 0; }
  .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  header {
    min-height: 59px; padding: 10px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #menu { display: none; }
  header h1 {
    font-size: 14px; margin: 0; font-weight: 600; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    margin-right: auto; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px;
  }
  #log { flex: 1; overflow-y: auto; padding: 22px 16px; width: 100%; }
  .log-inner { max-width: 820px; margin: 0 auto; }
  .msg { margin-bottom: 22px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user); }
  .tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .tool {
    font-size: 11px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
    display: inline-flex; align-items: center; gap: 8px; width: fit-content;
  }
  .tool.running::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1s infinite;
  }
  .tool.done::before { content: "✓"; color: #3ddc84; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  pre {
    direction: ltr; text-align: left; background: #0b0d11;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 12px 0;
  }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  :not(pre) > code {
    direction: ltr; display: inline-block; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 12.5px;
  }
  .sources { margin-top: 14px; }
  .sources .label { font-size: 11px; color: var(--muted); margin-bottom: 7px; }
  .src {
    display: block; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; margin-bottom: 6px;
    text-decoration: none; color: var(--text); font-size: 12px;
  }
  .src:hover { border-color: var(--accent); }
  .src .sec { color: var(--muted); }
  .meta { font-size: 10px; color: var(--muted); margin-top: 8px; }
  .err { border-color: #7f2b2b; background: #2a1414; color: #ffb4b4; }
  .empty {
    max-width: 620px; margin: 13vh auto 0; text-align: center;
    color: var(--muted); padding: 0 18px;
  }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .hints { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 22px; }
  .hint {
    font-size: 12px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 13px; cursor: pointer; color: var(--muted);
  }
  .hint:hover { border-color: var(--accent); color: var(--text); }
  footer {
    border-top: 1px solid var(--border); padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom)); flex-shrink: 0;
  }
  form { display: flex; gap: 8px; max-width: 820px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font: inherit; font-size: 14px; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 20px; font-size: 14px;
  }
  #send:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
  .scrim { display: none; }
  @media (max-width: 720px) {
    .sidebar {
      position: fixed; inset: 0 0 0 auto; width: min(86vw, 310px);
      transform: translateX(105%); transition: transform .2s ease;
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    .scrim { position: fixed; inset: 0; background: #0009; z-index: 15; }
    body.sidebar-open .scrim { display: block; }
    #menu { display: inline-block; }
    #log { padding: 15px 11px; }
    header { padding: 9px 11px; }
    footer { padding-inline: 10px; }
    #send { padding: 0 15px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="تاریخچه گفتگوها">
    <div class="brand"><strong>دستیار لیارا</strong><span aria-hidden="true">💬</span></div>
    <button class="new-chat" id="new-chat">＋ گفتگوی جدید</button>
    <div class="history-label">گفتگوهای شما</div>
    <div id="sessions"></div>
    <div class="sidebar-foot">تاریخچه به همین مرورگر متصل است.</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header>
      <button class="icon-btn" id="menu" aria-label="باز کردن تاریخچه">☰</button>
      <h1 id="chat-title">گفتگوی جدید</h1>
      <span class="badge" id="mode">…</span>
    </header>

    <div id="log"><div class="log-inner" id="messages"></div></div>

    <footer>
      <form id="f">
        <textarea id="q" rows="1" placeholder="سؤالت درباره مستندات لیارا رو بپرس…" autocomplete="off"></textarea>
        <button type="submit" id="send">ارسال</button>
      </form>
    </footer>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
